name: Preparar ofertas

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar tendências do Mercado Livre
        run: node buscar-tendencias.mjs
